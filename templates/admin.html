<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Editar Cartão</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1a1a1a;
      color: white;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    h1 { font-size: 20px; color: #c0392b; }
    .header-actions { display: flex; gap: 10px; }
    .btn-sm {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .btn-outline { background: transparent; border: 1px solid #555; color: #ccc; }
    .btn-danger { background: transparent; border: 1px solid #c0392b; color: #c0392b; }
    .card-form {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #3a3a3a;
    }
    .success {
      background: rgba(39,174,96,0.15);
      border: 1px solid #27ae60;
      color: #2ecc71;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .field { margin-bottom: 20px; }
    label { display: block; color: #aaa; font-size: 13px; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #c0392b; }
    .upload-area {
      border: 2px dashed #3a3a3a;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: #c0392b; }
    .upload-area input[type="file"] { display: none; }
    .upload-label { cursor: pointer; font-size: 13px; color: #888; }
    .preview-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .current-img { font-size: 12px; color: #666; margin-top: 8px; text-align: center; }
    .btn-save {
      width: 100%;
      padding: 14px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #a93226; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Editar Cartão</h1>
      <div class="header-actions">
        <a href="/" class="btn-sm btn-outline" target="_blank">Ver cartão</a>
        <form method="post" action="/admin/logout" style="margin:0">
          <button type="submit" class="btn-sm btn-danger">Sair</button>
        </form>
      </div>
    </header>

    {% if request.query_params.get('saved') %}
    <div class="success">✓ Cartão atualizado com sucesso!</div>
    {% endif %}

    <form class="card-form" method="post" action="/admin/save" enctype="multipart/form-data">
      <div class="field">
        <label>Nome</label>
        <input type="text" name="nome" value="{{ card.nome }}" placeholder="Seu nome completo">
      </div>
      <div class="field">
        <label>Telefone / WhatsApp</label>
        <input type="text" name="telefone" value="{{ card.telefone }}" placeholder="(11) 99999-9999">
      </div>
      <div class="field">
        <label>Endereço</label>
        <input type="text" name="endereco" value="{{ card.endereco }}" placeholder="Rua, número — Bairro, Cidade">
      </div>

      <div class="field">
        <label>Foto do consultor</label>
        <div class="upload-area" onclick="document.getElementById('foto-input').click()">
          <label class="upload-label">📷 Clique para escolher foto (JPG/PNG, máx 2MB)</label>
          <input type="file" id="foto-input" name="foto" accept="image/jpeg,image/png"
                 onchange="previewImage(this, 'foto-preview')">
          <img id="foto-preview"
               {% if card.foto_path %}src="/static/{{ card.foto_path }}"{% endif %}
               class="preview-img"
               {% if not card.foto_path %}style="display:none"{% endif %}>
        </div>
        {% if card.foto_path %}<p class="current-img">Foto atual carregada</p>{% endif %}
      </div>

      <div class="field">
        <label>Logo da empresa</label>
        <div class="upload-area" onclick="document.getElementById('logo-input').click()">
          <label class="upload-label">🏢 Clique para escolher logo (JPG/PNG, máx 2MB)</label>
          <input type="file" id="logo-input" name="logo" accept="image/jpeg,image/png"
                 onchange="previewImage(this, 'logo-preview')">
          <img id="logo-preview"
               {% if card.logo_path %}src="/static/{{ card.logo_path }}"{% endif %}
               class="preview-img"
               {% if not card.logo_path %}style="display:none"{% endif %}>
        </div>
        {% if card.logo_path %}<p class="current-img">Logo atual carregado</p>{% endif %}
      </div>

      <button type="submit" class="btn-save">💾 Salvar alterações</button>
    </form>
  </div>

  <script>
    function previewImage(input, previewId) {
      const preview = document.getElementById(previewId);
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>
</body>
</html>
